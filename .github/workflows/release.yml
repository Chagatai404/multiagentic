name: release
# Manual, maintainer-triggered: creates the Git tag and GitHub Release for a commit that is
# already on main. It runs the test suite first and never uploads to a package index.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to release (must already be on main)
        required: true
      tag:
        description: Tag to create (must equal v<package version>)
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ inputs.commit }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the commit, tag name and version agree
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "commit is not on main"; exit 1; }
          version=$(python -c "import pathlib,re; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/eng/__init__.py').read_text()).group(1))")
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match package version $version"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"; exit 1
          fi
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q
      - run: python -m build
      - name: Create the tag and GitHub Release
        run: |
          gh release create "$TAG" dist/* --target "$COMMIT" --title "eng ${TAG#v}" \
            --notes-file docs/RELEASE.md --latest
