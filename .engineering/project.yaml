schema_version: 1
name: multiagentic
languages: [python]
provider: codex
budgets:
  wall_seconds: 900
checks:
  - name: lint
    argv: ['{python}', '-m', ruff, check, .]
    timeout_seconds: 30
    required: true
    confirmed: true
  - name: tests
    argv: ['{python}', '-m', pytest, '-q']
    timeout_seconds: 600
    required: true
    confirmed: true
